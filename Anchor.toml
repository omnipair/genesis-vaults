[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
points_vault = "qAtXGjatDymFUURzXLmc7ijNukSVk5aZbohtGANH8xw"

[programs.devnet]
points_vault = "qAtXGjatDymFUURzXLmc7ijNukSVk5aZbohtGANH8xw"

# A new address for the per-wallet vault design, deployed 2026-09-04 in slot 444251560. The
# old one-token-account-per-mint program at BfpWw4DFYvzAHJcRj3nYLBrosRrqJrfFTdPL2HYyw6Er
# (deployed 2026-08-10 in slot 438418459) is left running and untouched; nothing here upgrades
# it. Slot 444251560 is where a backfill of this deployment starts: nothing before it can name
# this program.
[programs.mainnet]
points_vault = "qAtXGjatDymFUURzXLmc7ijNukSVk5aZbohtGANH8xw"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# --no-experimental-strip-types keeps Node 24 from loading the .ts tests as ESM behind
# ts-node's back, which breaks named imports from CommonJS packages like @coral-xyz/anchor.
test = "NODE_OPTIONS=--no-experimental-strip-types TS_NODE_PROJECT=./tsconfig.json yarn run mocha -r ts-node/register -t 1000000 tests/**/*.ts"
